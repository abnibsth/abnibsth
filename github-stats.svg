<svg width="850" height="180" viewBox="0 0 850 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#121215"/>
    </linearGradient>

    <!-- Score Circle Gradients -->
    <linearGradient id="scoreGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <linearGradient id="streakRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="850" height="180" rx="16" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Vertical Divider Line -->
  <line x1="425" y1="25" x2="425" y2="155" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

  <!-- ================= LEFT SECTION: GITHUB STREAK & CONTRIBUTIONS ================= -->
  
  <!-- 1. Total Contributions -->
  <g transform="translate(60, 50)">
    <text x="40" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">146+</text>
    <text x="40" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#a1a1aa" text-anchor="middle">Total Contributions</text>
    <text x="40" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#71717a" text-anchor="middle">2025 - Present</text>
  </g>

  <!-- Divider 1 -->
  <line x1="160" y1="50" x2="160" y2="130" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- 2. Current Streak Circle Meter -->
  <g transform="translate(235, 82)">
    <!-- Outer Track Circle -->
    <circle cx="0" cy="0" r="32" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4" fill="none"/>
    <!-- Progress Circle -->
    <circle cx="0" cy="0" r="32" stroke="url(#streakRing)" stroke-width="4" fill="none" stroke-dasharray="201" stroke-dashoffset="40" stroke-linecap="round" transform="rotate(-90)"/>
    
    <!-- Flame Icon -->
    <path d="M-4 -18 C-4 -18 -8 -10 -4 -4 C-2 -1 0 1 0 4 C0 7 -3 9 -3 9 C0 9 5 6 5 1 C5 -4 1 -9 -4 -18 Z" fill="#38bdf8"/>
    
    <!-- Streak Number -->
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">15</text>
    
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Current Streak</text>
  </g>

  <!-- Divider 2 -->
  <line x1="310" y1="50" x2="310" y2="130" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- 3. Longest Streak -->
  <g transform="translate(365, 50)">
    <text x="20" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">21</text>
    <text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#a1a1aa" text-anchor="middle">Longest Streak</text>
  </g>

  <!-- ================= RIGHT SECTION: PAGESPEED / WEB QUALITY INSIGHTS ================= -->
  
  <!-- Header Title -->
  <g transform="translate(460, 38)">
    <!-- Rocket Icon -->
    <path d="M 0 10 C 2 3, 8 0, 14 0 C 14 6, 11 12, 4 14 Z M 3 11 C 5 7, 8 5, 11 4" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <text x="22" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">PageSpeed Insights &amp; Web Quality</text>
  </g>

  <!-- 4 PageSpeed Circular Gauges -->
  <!-- 1. Performance -->
  <g transform="translate(500, 100)">
    <circle cx="0" cy="0" r="22" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3.5" fill="none"/>
    <circle cx="0" cy="0" r="22" stroke="url(#scoreGreen)" stroke-width="3.5" fill="none" stroke-dasharray="138" stroke-dashoffset="4" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">99</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#a1a1aa" text-anchor="middle">Performance</text>
  </g>

  <!-- 2. Accessibility -->
  <g transform="translate(585, 100)">
    <circle cx="0" cy="0" r="22" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3.5" fill="none"/>
    <circle cx="0" cy="0" r="22" stroke="url(#scoreGreen)" stroke-width="3.5" fill="none" stroke-dasharray="138" stroke-dashoffset="12" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">96</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#a1a1aa" text-anchor="middle">Accessibility</text>
  </g>

  <!-- 3. Best Practices -->
  <g transform="translate(675, 100)">
    <circle cx="0" cy="0" r="22" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3.5" fill="none"/>
    <circle cx="0" cy="0" r="22" stroke="url(#scoreGreen)" stroke-width="3.5" fill="none" stroke-dasharray="138" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">100</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#a1a1aa" text-anchor="middle">Best Practices</text>
  </g>

  <!-- 4. SEO -->
  <g transform="translate(760, 100)">
    <circle cx="0" cy="0" r="22" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3.5" fill="none"/>
    <circle cx="0" cy="0" r="22" stroke="url(#scoreGreen)" stroke-width="3.5" fill="none" stroke-dasharray="138" stroke-dashoffset="8" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">98</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#a1a1aa" text-anchor="middle">SEO</text>
  </g>
</svg>
