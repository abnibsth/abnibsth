<svg width="850" height="170" viewBox="0 0 850 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    .day { rx: 2; ry: 2; width: 11px; height: 11px; }
    .c0 { fill: #161b22; }
    .c1 { fill: #0e4429; }
    .c2 { fill: #006d32; }
    .c3 { fill: #26a641; }
    .c4 { fill: #39d353; }
    .snake-body { fill: #38bdf8; rx: 3; ry: 3; }
    .snake-head { fill: #60a5fa; rx: 4; ry: 4; filter: drop-shadow(0 0 6px #38bdf8); }
    
    @keyframes moveSnake {
      0% { transform: translate(0px, 0px); }
      20% { transform: translate(120px, 0px); }
      40% { transform: translate(120px, 45px); }
      60% { transform: translate(300px, 45px); }
      80% { transform: translate(300px, 15px); }
      100% { transform: translate(520px, 15px); }
    }

    .snake-group {
      animation: moveSnake 12s infinite alternate ease-in-out;
    }
  </style>

  <rect width="850" height="170" rx="12" class="bg"/>

  <!-- Month Labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#7d8590">
